schema_version: 1
source:
  url: https://www.lojcalc.com/robots-satellites.html
  retrieved: 2026-09-10
  note: Robots & Satellites tool. No cross-track prerequisites — every level's `requires` in the source is a literal `[]`. Robot is the only add-instance category (cap 12). Satellites are 9 fixed named units across 3 rarity tiers (R/SR/SSR), not addable — their cost curve is shared per tier, not per satellite (source's `makeSatelliteTrack(id, category, nameKey, costs)` passes the same `costs` array to every satellite call-site within a tier). Resource keys match the source's RESOURCES array exactly. SSR tier's cost table is derived from source's per-level `SSR_LEVEL_DATADISK` (90 entries) summed into 9 brackets of 10 plus `SSR_BREAKTHROUGH_PLANETCOIN` — values below were independently recomputed via script during brainstorming (see brainstorm report), not hand-summed.
caps: { robots: 12 }
resources:
  - { key: PrisonerArmorData, label: Prisoner Armor Data, icon: /assets/images/lands-of-jail/robots-satellites/prisoner-armor-data.png }
  - { key: PowerModule, label: Power Module, icon: /assets/images/lands-of-jail/robots-satellites/power-module.png }
  - { key: AdvancedPowerModule, label: Advanced Power Module, icon: /assets/images/lands-of-jail/robots-satellites/advanced-power-module.png }
  - { key: DataDisk, label: Data Disk, icon: /assets/images/lands-of-jail/robots-satellites/data-disk.png }
  - { key: PlanetCoin, label: Planet Coin, icon: /assets/images/lands-of-jail/robots-satellites/planet-coin.png }
# 21 rows: index 0 = Level "1" (baseline, zero cost). Each level bracket after that is
# two consecutive steps, same reasoning as satelliteTiers[].levels below: the raw level
# (Prisoner Armor Data only) then that level's "maxed" step (Power Module + Advanced
# Power Module together). Each row's stable `id` (not its array position) is what gets
# persisted per profile.
robotLevels:
  - { id: level_1,         PrisonerArmorData: 0,     PowerModule: 0,   AdvancedPowerModule: 0 }
  - { id: level_10,        PrisonerArmorData: 1200,  PowerModule: 0,   AdvancedPowerModule: 0 }
  - { id: level_10_maxed,  PrisonerArmorData: 0,     PowerModule: 20,  AdvancedPowerModule: 0 }
  - { id: level_20,        PrisonerArmorData: 2310,  PowerModule: 0,   AdvancedPowerModule: 0 }
  - { id: level_20_maxed,  PrisonerArmorData: 0,     PowerModule: 30,  AdvancedPowerModule: 0 }
  - { id: level_30,        PrisonerArmorData: 3600,  PowerModule: 0,   AdvancedPowerModule: 0 }
  - { id: level_30_maxed,  PrisonerArmorData: 0,     PowerModule: 40,  AdvancedPowerModule: 10 }
  - { id: level_40,        PrisonerArmorData: 5320,  PowerModule: 0,   AdvancedPowerModule: 0 }
  - { id: level_40_maxed,  PrisonerArmorData: 0,     PowerModule: 60,  AdvancedPowerModule: 15 }
  - { id: level_50,        PrisonerArmorData: 7560,  PowerModule: 0,   AdvancedPowerModule: 0 }
  - { id: level_50_maxed,  PrisonerArmorData: 0,     PowerModule: 80,  AdvancedPowerModule: 20 }
  - { id: level_60,        PrisonerArmorData: 10260, PowerModule: 0,   AdvancedPowerModule: 0 }
