# One entry per rarity tier. `levels` is the shared cost curve for every satellite in
# that tier. Each in-game level bracket (10, 20, ...) is two consecutive steps here,
# not one merged row: the raw level (Data Disk only) then that same level's "maxed"
# breakthrough (Planet Coin only) — reaching level N+10 without maxing N first still
# needs N's Planet Coin eventually, so splitting them lets the engine's plain
# sum-cost-range logic price both paths correctly. Each row's stable snake_case `id`
# (not its array position) is what gets persisted per profile — so inserting or
# reordering rows later can never reinterpret a saved satellite's level, unlike a
# raw array index would. `estimated` is a list of resource keys, kept on whichever
# split row actually carries that resource (only R-level-50's Data Disk was flagged).
satelliteTiers:
  - key: R
    label: R
    badge: "#5b8cff"
    levels:
      - { id: not_started,      DataDisk: 0,     PlanetCoin: 0 }
      - { id: level_10,         DataDisk: 1565,  PlanetCoin: 0 }
      - { id: level_10_maxed,   DataDisk: 0,     PlanetCoin: 10 }
      - { id: level_20,         DataDisk: 2840,  PlanetCoin: 0 }
      - { id: level_20_maxed,   DataDisk: 0,     PlanetCoin: 20 }
