schema_version: 1
source:
  url: https://www.lojcalc.com/tomes-collections.html
  retrieved: 2026-09-10
  note: Tomes & Collections tool. Two independent, prerequisite-free repeatable instance tracks (Tome, Collection) sharing one stock pool and one combined breakdown — every level's `requires` in the source is a literal `[]`, so unlike Forticlad/Research there is no cascade/auto-bump logic here. Resource key names match the source's RESOURCES array exactly.
caps: { tomes: 18, collections: 6 }
# The 18 Tome slots are fixed too, same 3 troops as collectionSlots: each troop has
# 3 Attack + 3 Defense tomes (3 troops x 2 types x 3 = 18). Order is 3 consecutive
# slots per troop+type block.
tomeSlots:
  - { troop: shieldbearer, type: attack }
  - { troop: shieldbearer, type: attack }
  - { troop: shieldbearer, type: attack }
  - { troop: shieldbearer, type: defense }
  - { troop: shieldbearer, type: defense }
  - { troop: shieldbearer, type: defense }
  - { troop: bomber, type: attack }
  - { troop: bomber, type: attack }
  - { troop: bomber, type: attack }
  - { troop: bomber, type: defense }
  - { troop: bomber, type: defense }
  - { troop: bomber, type: defense }
  - { troop: shooter, type: attack }
  - { troop: shooter, type: attack }
  - { troop: shooter, type: attack }
  - { troop: shooter, type: defense }
  - { troop: shooter, type: defense }
  - { troop: shooter, type: defense }
# The 6 Collection slots are fixed in-game items, not a free-form add-up-to-6 list:
# 2 per troop (Shieldbearer, Bomber, Shooter). Order here is the fixed slot order.
collectionSlots:
  - { troop: shieldbearer, label: { en: "Knuckles", vi: "Găng tay" } }
  - { troop: shieldbearer, label: { en: "Helmet", vi: "Mũ bảo hiểm" } }
  - { troop: bomber, label: { en: "Frag Grenade", vi: "Lựu đạn mảnh" } }
  - { troop: bomber, label: { en: "High-Explosive Grenade", vi: "Lựu đạn nổ mạnh" } }
  - { troop: shooter, label: { en: "Short Gun", vi: "Súng ngắn" } }
  - { troop: shooter, label: { en: "Long Gun", vi: "Súng dài" } }
resources:
  - { key: SealOfWisdom, label: { en: "Seal of Wisdom", vi: "Bảo điển Trí tuệ" }, icon: /assets/images/lands-of-jail/collections-tomes/seal-of-wisdom.png }
  - { key: SealOfKnowledge, label: { en: "Seal of Knowledge", vi: "Bảo điển Tri thức" }, icon: /assets/images/lands-of-jail/collections-tomes/seal-of-knowledge.png }
